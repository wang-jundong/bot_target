[package]
name = "bot_target"
version = "0.1.0"
edition = "2024"
description = "Rust port of bot_target multi-strategy Solana trading bot (v011/v022/v031)"

[[bin]]
name = "bot_target"
path = "src/main.rs"

[[bin]]
name = "close-accounts"
path = "src/bin/close_accounts.rs"

[[bin]]
name = "sell-all"
path = "src/bin/sell_all.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
# five8 1.0 resolves five8_core 0.1, whose DecodeError implements Error only
# with `std`. solana-keypair needs that impl.
five8_core = { version = "0.1.2", features = ["std"] }
futures = "0.3"
hmac = "0.12"
openssl-sys = { version = "0.9", features = ["vendored"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Agave 4.3 client + solana-sdk 4.1 (solana-message 4.5 / solana-transaction 4.3).
# That line is the first that can build and read v1 transactions (SIMD-0385).
# Yellowstone proto 12.7 already carries Message.config. SPL stays on its 2.x
# line; nothing in this crate calls it, and SPL 8/9 does not track pubkey 4.
# gRPC transport follows New Folder: keepalive + in-place filter updates.
solana-account-decoder-client-types = "=4.3.2"
solana-client = "=4.3.2"
solana-commitment-config = "=3.1.1"
solana-compute-budget-interface = "=3.1.0"
solana-sdk = "=4.1.0"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
solana-transaction = { version = "=4.3.0", features = ["wincode"] }
solana-transaction-status-client-types = "=4.3.2"
spl-associated-token-account = "=7.0.0"
spl-token = "=8.0.0"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wincode = "0.6"
yellowstone-grpc-client = "=13.5.1"
yellowstone-grpc-proto = { version = "=12.7.0", default-features = false, features = ["tonic", "tonic-compression"] }
